<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer reel body -->
  <circle cx="32" cy="32" r="30" fill="#111"/>
  <!-- Sprocket holes around the edge -->
  <circle cx="32" cy="6"   r="4" fill="#fff"/>
  <circle cx="54.6" cy="18" r="4" fill="#fff"/>
  <circle cx="54.6" cy="46" r="4" fill="#fff"/>
  <circle cx="32" cy="58"  r="4" fill="#fff"/>
  <circle cx="9.4" cy="46" r="4" fill="#fff"/>
  <circle cx="9.4" cy="18" r="4" fill="#fff"/>
  <!-- Inner hub -->
  <circle cx="32" cy="32" r="12" fill="#333"/>
  <!-- Hub spokes -->
  <line x1="32" y1="20" x2="32" y2="14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="42" y2="38" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="20" x2="22" y2="38" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center spindle -->
  <circle cx="32" cy="32" r="4" fill="#fff"/>
</svg>
