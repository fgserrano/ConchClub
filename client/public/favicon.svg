<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background Rounded Canvas -->
  <rect width="100" height="100" rx="22" fill="#07190a"/>

<!-- Left Reel (cx=27, left edge x=11) -->
  <circle cx="27" cy="31" r="16" fill="#07190a" stroke="#f6f3ea" stroke-width="4.5"/>
  <circle cx="27" cy="31" r="4" fill="#a13d39"/>
  <circle cx="27" cy="20" r="2.2" fill="#f6f3ea"/>
  <circle cx="36" cy="35" r="2.2" fill="#f6f3ea"/>
  <circle cx="18" cy="35" r="2.2" fill="#f6f3ea"/>

  <!-- Right Reel (cx=58, nudge overlap with left reel) -->
  <circle cx="58" cy="31" r="16" fill="#07190a" stroke="#f6f3ea" stroke-width="4.5"/>
  <circle cx="58" cy="31" r="4" fill="#a13d39"/>
  <circle cx="58" cy="20" r="2.2" fill="#f6f3ea"/>
  <circle cx="67" cy="35" r="2.2" fill="#f6f3ea"/>
  <circle cx="49" cy="35" r="2.2" fill="#f6f3ea"/>

  <!-- Viewfinder Mount -->
  <rect x="20" y="42" width="12" height="5" rx="1.5" fill="#f6f3ea"/>

  <!-- Camera Body (x=16 to x=68, right edge x=89 with horn) -->
  <rect x="16" y="47" width="52" height="32" rx="5" fill="#f6f3ea"/>

  <!-- Camera Body Accent Strip -->
  <rect x="16" y="60" width="52" height="6" fill="#a13d39"/>

  <!-- Camera Lens Conical Hood -->
  <path d="M 68 53 L 86 46 L 86 74 L 68 67 Z" fill="#f6f3ea"/>

  <!-- Lens Front Accent -->
  <rect x="85" y="44" width="4" height="32" rx="2" fill="#a13d39"/>
</svg>
